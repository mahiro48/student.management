<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生編集</title>
</head>
<body>

<h1>受講生編集</h1>

<form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post">

  <div>
    <label>ID：</label>
    <input type="text" th:field="*{student.id}" readonly />
  </div>

  <div>
    <label>名前：</label>
    <input type="text" th:field="*{student.name}" required />
  </div>

  <div>
    <label>カナ名：</label>
    <input type="text" th:field="*{student.kanaName}" required />
  </div>

  <div>
    <label>ニックネーム：</label>
    <input type="text" th:field="*{student.nickname}" required />
  </div>

  <div>
    <label>メール：</label>
    <input type="text" th:field="*{student.email}" required />
  </div>

  <div>
    <label>地域：</label>
    <input type="text" th:field="*{student.region}" required />
  </div>

  <div>
    <label>年齢：</label>
    <input type="text" th:field="*{student.age}" />
  </div>

  <div>
    <label>性別：</label>
    <input type="text" th:field="*{student.sex}" />
  </div>

  <div>
    <label>備考：</label>
    <input type="text" th:field="*{student.remark}" />
  </div>

  <div>
    <label>キャンセル：</label>
    <input type="checkbox" th:field="*{student.isDeleted}" />
  </div>

  <h3>受講コース</h3>

  <div th:each="course, stat : *{studentCourses}">

    <input type="hidden" th:field="*{studentCourses[__${stat.index}__].id}" />

    <label>コース名：</label>
    <input type="text" th:field="*{studentCourses[__${stat.index}__].courseName}" />
  </div>

  <button type="submit">更新</button>

</form>

</body>
</html>
