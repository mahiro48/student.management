<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>受講生一覧</title>
</head>
<body>
<h1>受講生一覧</h1>

<table border="1">
  <tr>
    <th>ID</th>
    <th>名前</th>
    <th>カナ名</th>
    <th>メール</th>
    <th>地域</th>
    <th>操作</th>
  </tr>

  <tr th:each="detail : ${studentList}">
    <td th:text="${detail.student.id}"></td>
    <td th:text="${detail.student.name}"></td>
    <td th:text="${detail.student.kanaName}"></td>
    <td th:text="${detail.student.email}"></td>
    <td th:text="${detail.student.region}"></td>
    <td>
      <a th:href="@{'/student/' + ${detail.student.id}}">編集</a>
    </td>
  </tr>

</table>

<br>
<a href="/newStudent">新規登録</a>

</body>
</html>
